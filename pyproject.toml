[project]
name = "slideannotator"
version = "0.1.0"
description = "Histological slide annotation tool for mIF images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pyvips>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "onnxruntime<=1.20",
    "h5py>=3.16.0",
    "loguru>=0.7.3",
    "pylibczirw>=6.0.1",
    "pillow>=10.0",
]

[project.scripts]
slideannotator = "slideannotator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "python-semantic-release>=9.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = ""
upload_to_pypi = false
upload_to_release = true
tag_format = "v{version}"
